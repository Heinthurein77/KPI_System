# Ruff config (T-m3, 2026-11-20 senior review): the Python lint gate.
#
# Deliberately narrow: only runtime-error rules (E9) and Pyflakes (F) —
# unused imports and undefined names, the class of failure that broke
# CI on the tracker side in 2026-11-19 (pyflakes on dead imports). Style
# rules (E501, W605, ...) are NOT enabled: the repo never had a Python
# linter, so turning them on would flag hundreds of pre-existing lines
# and force a whole-repo reformat. Widen the selection only with a
# dedicated cleanup pass.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Widened 2026-11-25 (M-20, security review): E4 (import placement),
# E7 (statement issues) and W (whitespace warnings) join E9 + F. B
# (bugbear, 191 findings) and UP (pyupgrade, 351) were measured and are
# deliberately NOT enabled yet — a dedicated cleanup pass, not a drive-by.
select = ["E9", "F", "E4", "E7", "W"]

# Three pre-existing findings in files owned by other tracks, exempted
# here rather than fixed in a track that does not own them (2026-11-25
# security fix-all, Track 3). Each is one line; the owning track or the
# coordinator can fix it and drop the exemption.
[tool.ruff.lint.per-file-ignores]
"app/migrations/versions/0001_baseline.py" = ["W291"]
"app/routers/dashboard.py" = ["W292"]
"app/tests/test_dept_admin_department_visibility.py" = ["E402"]
