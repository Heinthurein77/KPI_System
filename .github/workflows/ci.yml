# CI gate (M1, 2026-11-12 PM review): the backend suite, the frontend
# build, and the linter run on every push, so a broken commit is caught by
# the gate instead of by users on production. This is the documented gate
# before any push request — do not push past a red run.
#
# NOTE on the 11 deselected tests: they are the accepted baseline from the
# 2026-10-21 user decision (over-target combined-score behaviour, left
# as-is on purpose). They fail at HEAD and are NOT a regression signal, so
# they are deselected here by node id until that decision changes. If a
# deselected test starts passing, pytest's --deselect silently ignores it,
# so re-check this list whenever the scoring decision is revisited.
#   - 9x test_combined_score.py (over-target calculation)
#   - 1x test_dashboard_endpoint.py::test_dashboard_employee_combined_keeps_same_name_employees_separate
#   - 1x test_dept_admin_department_visibility.py::test_dept_admin_personal_kpi_visible_in_department_filter
name: CI

on:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Backend tests
        run: >-
          python -m pytest app/tests/ -q
          --deselect app/tests/test_combined_score.py::test_weighted_average_across_mixed_weights
          --deselect app/tests/test_combined_score.py::test_target_zero_or_none_is_skipped_but_counts_toward_total_count
          --deselect app/tests/test_combined_score.py::test_attainment_capped_at_default_max_cap_120
          --deselect app/tests/test_combined_score.py::test_attainment_uncapped_when_max_cap_is_none
          --deselect app/tests/test_combined_score.py::test_is_lower_better_inverts_formula
          --deselect app/tests/test_combined_score.py::test_is_lower_better_actual_zero_or_negative_is_special_cased_to_100
          --deselect app/tests/test_combined_score.py::test_status_good_at_exactly_100
          --deselect app/tests/test_combined_score.py::test_status_warning_at_exactly_85
          --deselect app/tests/test_combined_score.py::test_status_critical_just_under_85
          --deselect app/tests/test_dashboard_endpoint.py::test_dashboard_employee_combined_keeps_same_name_employees_separate
          --deselect app/tests/test_dept_admin_department_visibility.py::test_dept_admin_personal_kpi_visible_in_department_filter

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
