# Production stack: the web app behind Caddy (automatic HTTPS). The database is
# a local Postgres container (since the 2026-11-25 Neon → server migration —
# Neon Free hit its 1 GB / 100 CU-h limits). DATABASE_URL in .env points at it
# over the compose network; there is deliberately no published Postgres port.
# For local development with a throwaway Postgres, use docker-compose.local.yml.
services:
  db:
    image: postgres:${PG_VERSION:-18}-alpine
    container_name: kpi-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kpi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kpi_system}
    # No ports: only the web container reaches it, over the compose network.
    volumes:
      - kpi_prod_pg_data:/var/lib/postgresql/data
    # Small box (2 GB, web already capped at 1g): keep Postgres modest.
    # shared_buffers 128 MB is plenty for this workload.
    command: postgres -c shared_buffers=128MB -c max_connections=50
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kpi}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      args:
        # Footer release identity (M3, 2026-11-12): the Docker build has no
        # .git, so the commit only reaches the bundle when passed as a build
        # arg. Compose reads it from the environment — deploy with
        # VITE_APP_COMMIT=$(git rev-parse --short HEAD) in front of the
        # up/build command (see README "Production"). Defaults to "dev" so a
        # plain build still works.
        VITE_APP_COMMIT: ${VITE_APP_COMMIT:-dev}
    container_name: kpi-web
    restart: always
    env_file: .env
    environment:
      # Wins over anything in .env, so a forgotten line there can never start the
      # server in development mode (which would expose /docs and skip key checks).
      ENVIRONMENT: production
    # Not published to the host: Caddy reaches it over the compose network, so the
    # only way in from the internet is through HTTPS.
    expose:
      - "8000"
    # Keep a runaway process from taking SSH and the OS down with it on a 2 GB box;
    # the container is simply restarted (restart: always) if it ever hits this.
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
    # Give gunicorn's graceful-timeout (30s) room to finish in-flight requests
    # before docker escalates to SIGKILL on `docker compose down/up`.
    stop_grace_period: 40s
    # The image ships its own HEALTHCHECK (GET /readyz — runs SELECT 1, so
    # Caddy only gets traffic once the database answers; the 30s probe
    # keeps a suspended Neon compute awake, see the Dockerfile comment).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: kpi-caddy
    restart: always
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"        # certificate challenge + http -> https redirect
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env to your site hostname, e.g. kpi.example.com}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and ACME account live here. Losing this volume means
      # re-issuing on every redeploy, which quickly hits Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  kpi_prod_pg_data:
